name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy (the consoles need the API to exist already)
        type: choice
        options: [all, api, dashboard, admin-app, homepage]
        default: all

permissions:
  contents: read
  id-token: write # Workload Identity Federation: no long-lived GCP key stored in GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bond

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm --prefix api ci
      - run: npm --prefix homepage ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Deploys the chosen app, or all of them: the API first, because the consoles bake its URL in at build time.
      - name: Build and deploy
        env:
          APP: ${{ inputs.app || 'all' }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          API_ENV: BOND_MONGO_DB=Niroun,BOND_TRUST_PROXY=1,BOND_COOKIE_SECURE=1,BOND_GCS_BUCKET=${{ vars.BOND_GCS_BUCKET }},BOND_PUBLIC_URL=${{ vars.BOND_PUBLIC_URL }},BOND_STAFF_URL=${{ vars.BOND_STAFF_URL }}
        run: |
          build() { docker build -f deploy/$1.Dockerfile "${@:2}" -t "$REGISTRY/$1:$GITHUB_SHA" . && docker push "$REGISTRY/$1:$GITHUB_SHA"; }
          want() { [ "$APP" = all ] || [ "$APP" = "$1" ]; }

          if want api; then
            build api
            gcloud run deploy bond-api --image "$REGISTRY/api:$GITHUB_SHA" --region "$REGION"               --service-account "$RUNTIME_SA" --allow-unauthenticated               --set-env-vars "$API_ENV"               --set-secrets "BOND_MONGO_URL=bond-mongo-url:latest,BOND_ENCRYPTION_KEY=bond-encryption-key:latest"
          fi

          API_URL=$(gcloud run services describe bond-api --region "$REGION" --format 'value(status.url)' || true)
          for app in dashboard admin-app; do
            want $app || continue
            [ -n "$API_URL" ] || { echo "::error::bond-api isn't deployed yet; deploy it first."; exit 1; }
            build $app --build-arg BOND_API_URL="$API_URL"
            gcloud run deploy "bond-$app" --image "$REGISTRY/$app:$GITHUB_SHA" --region "$REGION"               --service-account "$RUNTIME_SA" --allow-unauthenticated
          done

          if want homepage; then
            build homepage
            gcloud run deploy bond-homepage --image "$REGISTRY/homepage:$GITHUB_SHA" --region "$REGION"               --service-account "$RUNTIME_SA" --allow-unauthenticated
          fi
