# Reusable: test one app, then build its image and deploy it to Cloud Run. Called by deploy-<app>.yml.
name: Deploy one app

on:
  workflow_call:
    inputs:
      app:
        description: api, dashboard, admin-app or homepage
        required: true
        type: string
      test-command:
        required: true
        type: string
      mongo:
        description: Start a MongoDB replica set for the tests
        type: boolean
        default: false

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/niroun

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci # the dashboard/admin-app/console-core workspace
      - if: inputs.app == 'api'
        run: npm --prefix api ci
      - if: inputs.app == 'homepage'
        run: npm --prefix homepage ci
      - if: inputs.mongo
        # The API tests need MongoDB as a replica set; its compose file starts one and waits until it is healthy.
        run: docker compose -f api/docker-compose.yml up -d --wait
      - run: ${{ inputs.test-command }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and deploy niroun-${{ inputs.app }}
        env:
          APP: ${{ inputs.app }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          API_ENV: BOND_MONGO_DB=Niroun,BOND_TRUST_PROXY=1,BOND_COOKIE_SECURE=1,BOND_GCS_BUCKET=${{ vars.BOND_GCS_BUCKET }},BOND_PUBLIC_URL=${{ vars.BOND_PUBLIC_URL }},BOND_STAFF_URL=${{ vars.BOND_STAFF_URL }}
        run: |
          IMAGE="$REGISTRY/$APP:$GITHUB_SHA"
          build() {
            docker build -f "deploy/$APP.Dockerfile" "$@" -t "$IMAGE" .
            docker push "$IMAGE"
          }
          deploy() {
            gcloud run deploy "niroun-$APP" --image "$IMAGE" --region "$REGION" \
              --service-account "$RUNTIME_SA" --allow-unauthenticated "$@"
          }

          case "$APP" in
            api)
              build
              deploy --set-env-vars "$API_ENV" \
                --set-secrets "BOND_MONGO_URL=niroun-mongo-url:latest,BOND_ENCRYPTION_KEY=niroun-encryption-key:latest"
              ;;
            dashboard|admin-app)
              # The consoles bake the API's URL in at build time, so the API must exist first.
              API_URL=$(gcloud run services describe niroun-api --region "$REGION" --format 'value(status.url)' || true)
              [ -n "$API_URL" ] || { echo "::error::niroun-api isn't deployed yet; deploy it first."; exit 1; }
              build --build-arg BOND_API_URL="$API_URL"
              deploy
              ;;
            homepage)
              build
              deploy
              ;;
            *)
              echo "::error::unknown app: $APP"; exit 1
              ;;
          esac
